name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: solo-leveling-fdd0f
          channelId: live
          # firebase-tools 15.34.1 started requiring serviceusage.services.get, which this deploy account
          # doesn't have (403 on every run). 15.34.0 is the last version that deployed fine.
          firebaseToolsVersion: '15.34.0'
