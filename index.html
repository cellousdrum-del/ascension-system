<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05070f">
<!-- iOS PWA (full screen when added to Home Screen) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="System">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.json">
<title>Ascension System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070f;
    --panel:rgba(11,20,40,0.72);
    --cyan:#4da3ff;
    --cyan-soft:#7cc4ff;
    --violet:#8b5cf6;
    --gold:#fbbf24;
    --red:#ef4444;
    --green:#34d399;
    --ink:#dbeafe;
    --muted:#7c8aa5;
    --line:rgba(77,163,255,0.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Rajdhani',system-ui,sans-serif;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(77,163,255,0.10), transparent 60%),
      radial-gradient(900px 600px at 90% 110%, rgba(139,92,246,0.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    min-height:100vh;
    padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    line-height:1.35;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
    background-image:
      linear-gradient(rgba(77,163,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,163,255,0.06) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image:radial-gradient(circle at 50% 20%, #000 30%, transparent 85%);
  }
  #app{position:relative;z-index:1;max-width:520px;margin:0 auto}
  #app.view-only{pointer-events:none;opacity:.85}

  h1,h2,h3,.sys,.rank,.lvl,.stat-val{font-family:'Orbitron',sans-serif}

  .win{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:2px;
    padding:16px 16px 14px;
    margin:0 0 14px;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    box-shadow:0 0 22px rgba(77,163,255,0.10), inset 0 0 30px rgba(77,163,255,0.04);
  }
  .win::before,.win::after{
    content:"";position:absolute;width:14px;height:14px;pointer-events:none;
    border:2px solid var(--cyan);
  }
  .win::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
  .win::after{bottom:-1px;right:-1px;border-left:none;border-top:none}

  .win.rank-e{border-width:2px;border-color:rgba(250,204,21,0.95);background:linear-gradient(rgba(250,204,21,0.07),rgba(250,204,21,0.07)),var(--panel);box-shadow:0 0 30px rgba(250,204,21,0.45), inset 0 0 38px rgba(250,204,21,0.14)}
  .win.rank-e::before,.win.rank-e::after{border-color:#facc15}
  .win.rank-d{border-width:2px;border-color:rgba(163,230,53,0.95);background:linear-gradient(rgba(163,230,53,0.07),rgba(163,230,53,0.07)),var(--panel);box-shadow:0 0 30px rgba(163,230,53,0.45), inset 0 0 38px rgba(163,230,53,0.14)}
  .win.rank-d::before,.win.rank-d::after{border-color:#a3e635}
  .win.rank-c{border-width:2px;border-color:rgba(34,211,238,0.95);background:linear-gradient(rgba(34,211,238,0.07),rgba(34,211,238,0.07)),var(--panel);box-shadow:0 0 30px rgba(34,211,238,0.45), inset 0 0 38px rgba(34,211,238,0.14)}
  .win.rank-c::before,.win.rank-c::after{border-color:#22d3ee}
  .win.rank-b{border-width:2px;border-color:rgba(59,130,246,0.95);background:linear-gradient(rgba(59,130,246,0.07),rgba(59,130,246,0.07)),var(--panel);box-shadow:0 0 30px rgba(59,130,246,0.45), inset 0 0 38px rgba(59,130,246,0.14)}
  .win.rank-b::before,.win.rank-b::after{border-color:#3b82f6}
  .win.rank-a{border-width:2px;border-color:rgba(168,85,247,0.95);background:linear-gradient(rgba(168,85,247,0.07),rgba(168,85,247,0.07)),var(--panel);box-shadow:0 0 32px rgba(168,85,247,0.5), inset 0 0 40px rgba(168,85,247,0.15)}
  .win.rank-a::before,.win.rank-a::after{border-color:#a855f7}
  .win.rank-s{border-width:2px;border-color:rgba(244,63,94,1);background:linear-gradient(rgba(244,63,94,0.09),rgba(244,63,94,0.09)),var(--panel);box-shadow:0 0 38px rgba(244,63,94,0.6), inset 0 0 46px rgba(244,63,94,0.2)}
  .win.rank-s::before,.win.rank-s::after{border-color:#f43f5e}

  .eyebrow{
    font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.32em;
    color:var(--cyan);text-transform:uppercase;
    text-shadow:0 0 12px rgba(77,163,255,0.6);
    margin:0 0 10px;display:flex;align-items:center;gap:8px;
  }
  .eyebrow::before{content:"\201C";opacity:.8}
  .eyebrow::after{content:"\201D";opacity:.8;margin-left:auto}

  .title-xl{font-size:26px;font-weight:900;letter-spacing:.04em;margin:0;
    text-shadow:0 0 18px rgba(77,163,255,0.45)}

  .hunter-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .hname{font-family:'Orbitron';font-weight:700;font-size:19px;letter-spacing:.03em;margin:2px 0 2px}
  .rank{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:52px;height:52px;font-size:26px;font-weight:900;
    border-radius:3px;flex-direction:column;line-height:1;
  }
  .rank small{display:block;font-family:'Rajdhani';font-size:8px;letter-spacing:.2em;color:var(--muted);
    text-shadow:none;margin-top:1px}
  .lvl{font-size:13px;color:var(--cyan-soft);letter-spacing:.14em}
  .lvl b{color:#fff;font-size:16px}
  .title-line{font-size:12px;color:var(--gold);font-style:italic;letter-spacing:.03em;margin-top:3px}

  .bar{height:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(77,163,255,0.25);
    border-radius:2px;overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;width:0;border-radius:0;
    background:linear-gradient(90deg,var(--cyan),var(--violet));
    box-shadow:0 0 14px rgba(77,163,255,0.6);transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .bar-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
    letter-spacing:.08em;margin-top:5px;text-transform:uppercase}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
  .stat{border:1px solid rgba(77,163,255,0.22);border-radius:2px;padding:9px 11px;
    background:rgba(77,163,255,0.04);display:flex;justify-content:space-between;align-items:center}
  .stat .k{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .stat .stat-val{font-size:18px;color:#fff;text-shadow:0 0 10px rgba(77,163,255,0.4)}
  .stat.up .stat-val{color:var(--green);text-shadow:0 0 12px rgba(52,211,153,0.7)}
  .stat.down .stat-val{color:var(--red);text-shadow:0 0 12px rgba(239,68,68,0.7)}

  .weight-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  .weight-now{font-family:'Orbitron';font-size:28px;font-weight:700;color:#fff}
  .weight-now span{font-size:14px;color:var(--muted);font-weight:500}
  .weight-goal{font-size:13px;color:var(--cyan-soft);letter-spacing:.06em}

  .gates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px}
  .gate{border:1px solid rgba(77,163,255,0.3);border-radius:2px;padding:10px 4px;text-align:center;
    cursor:pointer;background:rgba(11,20,40,0.5);transition:.15s;user-select:none}
  .gate .g-ic{font-size:18px;line-height:1}
  .gate .g-nm{font-family:'Orbitron';font-size:10px;letter-spacing:.1em;margin-top:5px;color:var(--muted)}
  .gate .g-sub{font-size:9px;color:#4a5b76;letter-spacing:.05em;margin-top:1px}
  .gate[data-active="1"]{border-color:var(--cyan);background:rgba(77,163,255,0.12);
    box-shadow:0 0 16px rgba(77,163,255,0.2)}
  .gate[data-active="1"] .g-nm{color:var(--cyan-soft)}
  .gate[data-color="red"][data-active="1"]{border-color:#ff6b6b;box-shadow:0 0 16px rgba(255,107,107,.2)}
  .gate[data-color="violet"][data-active="1"]{border-color:var(--violet);box-shadow:0 0 16px rgba(139,92,246,.2)}

  ul.ex{list-style:none;margin:6px 0 0;padding:0}
  ul.ex li{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px dashed rgba(77,163,255,0.14);
    cursor:pointer;transition:.12s}
  ul.ex li:last-child{border-bottom:none}
  .chk{flex:0 0 auto;width:22px;height:22px;border:1.5px solid var(--cyan);border-radius:2px;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:.15s}
  li.done .chk{background:rgba(77,163,255,0.18);color:var(--cyan);box-shadow:0 0 12px rgba(77,163,255,.5)}
  li.done .ex-nm{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(124,138,165,.6)}
  .dq.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(124,138,165,.6)}
  .ex-nm{font-size:15px;font-weight:600}
  .ex-tg{font-size:12px;color:var(--cyan-soft);letter-spacing:.04em;font-weight:600}
  .ex-nm small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.02em}

  button{font-family:'Rajdhani',sans-serif;cursor:pointer}
  .btn{
    width:100%;font-family:'Orbitron';font-weight:700;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--bg);background:linear-gradient(90deg,var(--cyan),var(--cyan-soft));
    border:none;border-radius:2px;padding:14px;margin-top:14px;
    box-shadow:0 0 20px rgba(77,163,255,0.4);transition:.15s;
  }
  .btn:active{transform:translateY(1px)}
  .btn:disabled{background:rgba(77,163,255,0.15);color:var(--muted);box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--cyan-soft);border:1px solid var(--line);box-shadow:none;
    letter-spacing:.1em}
  .btn.sm{width:auto;padding:9px 14px;font-size:11px;margin:0}

  .daily{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .dq{display:flex;align-items:center;gap:11px;padding:9px 4px;cursor:pointer}
  .dq .chk{width:20px;height:20px;font-size:12px}
  .dq .t{font-size:14px;font-weight:600}
  .dq .t small{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .penalty{margin-top:10px;font-size:11px;letter-spacing:.08em;color:var(--red);
    border:1px dashed rgba(239,68,68,0.4);border-radius:2px;padding:8px 10px;
    background:rgba(239,68,68,0.05);text-transform:uppercase}
  .streak{font-family:'Orbitron';font-size:12px;color:var(--gold);letter-spacing:.08em;text-align:right;
    margin-top:2px;text-shadow:0 0 12px rgba(251,191,36,.4)}

  label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    margin:14px 0 6px}
  input,select{width:100%;background:rgba(5,7,15,0.7);border:1px solid var(--line);border-radius:2px;
    color:#fff;font-family:'Rajdhani';font-size:17px;font-weight:600;padding:12px 13px;outline:none}
  input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(77,163,255,0.25)}
  .inline-w{display:flex;gap:10px;align-items:flex-end}
  .inline-w input{flex:1}

  details.guide{margin-top:2px}
  details.guide summary{list-style:none;cursor:pointer;font-family:'Orbitron';font-size:11px;
    letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:8px}
  details.guide summary::-webkit-details-marker{display:none}
  details.guide summary::after{content:"\25B8";margin-left:auto;transition:.2s}
  details.guide[open] summary::after{transform:rotate(90deg)}
  .guide-body{font-size:14px;color:#c7d6ee;margin-top:12px}
  .guide-body p{margin:0 0 10px}
  .guide-body b{color:var(--cyan-soft)}
  .guide-body .note{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}

  #toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-140%);
    opacity:0;visibility:hidden;
    z-index:60;max-width:460px;width:calc(100% - 28px);pointer-events:none;
    transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s ease,visibility 0s linear .45s}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;
    transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s ease}
  .toast-win{background:rgba(9,16,33,0.95);border:1px solid var(--cyan);border-radius:2px;padding:12px 14px;
    box-shadow:0 0 26px rgba(77,163,255,0.45)}
  .toast-win .th{font-family:'Orbitron';font-size:10px;letter-spacing:.28em;color:var(--cyan);
    text-transform:uppercase;margin-bottom:4px}
  .toast-win .tb{font-size:15px;font-weight:600}

  #overlay{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,rgba(77,163,255,0.14),rgba(5,7,15,0.94));
    display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
  #overlay.show{display:flex}
  #boxOverlay{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,rgba(139,92,246,0.16),rgba(5,7,15,0.94));
    display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
  #boxOverlay.show{display:flex}
  .box-ic{font-size:52px;line-height:1;margin:10px 0;filter:drop-shadow(0 0 18px rgba(139,92,246,0.7));
    animation:glow 1.4s ease-in-out infinite alternate}
  .box-item{font-size:15px;color:var(--ink);letter-spacing:.04em;margin:4px 0}
  .box-item .bi-icon{font-size:30px;display:block;margin-bottom:6px}
  .box-item .bi-name{font-family:'Orbitron';font-size:15px;color:var(--violet);letter-spacing:.05em}
  .box-item .bi-kind{font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:2px}

  .avatar-stage{position:relative;height:200px;margin:10px 0 18px;display:flex;align-items:flex-end;justify-content:center}
  .avatar-figure{width:70px}
  .avatar-head{width:42px;height:42px;border-radius:50%;background:linear-gradient(180deg,#131f38,#05070f);
    margin:0 auto;position:relative;transition:box-shadow .4s}
  .avatar-body{width:70px;height:88px;border-radius:26px 26px 8px 8px;background:linear-gradient(180deg,#131f38,#05070f);
    margin-top:-6px;transition:box-shadow .4s}
  .avatar-eye{position:absolute;top:16px;width:7px;height:5px;border-radius:2px;background:var(--cyan);
    box-shadow:0 0 8px var(--cyan),0 0 16px var(--cyan)}
  .avatar-eye.left{left:10px}
  .avatar-eye.right{right:10px}
  .avatar-shadow-copy .avatar-head,.avatar-shadow-copy .avatar-body{background:rgba(5,7,15,0.85);box-shadow:none}
  .levelup{max-width:360px;width:100%;text-align:center;border:1px solid var(--cyan);border-radius:3px;
    background:rgba(9,16,33,0.9);padding:28px 22px;box-shadow:0 0 40px rgba(77,163,255,0.5);
    animation:pop .4s cubic-bezier(.2,1.2,.3,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .levelup .lu-k{font-family:'Orbitron';font-size:11px;letter-spacing:.3em;color:var(--cyan);text-transform:uppercase}
  .levelup .lu-n{font-family:'Orbitron';font-size:52px;font-weight:900;color:var(--gold);line-height:1;margin:8px 0 4px;
    text-shadow:0 0 26px rgba(251,191,36,0.7);animation:glow 1.4s ease-in-out infinite alternate}
  @keyframes glow{to{text-shadow:0 0 40px rgba(251,191,36,0.95)}}
  .levelup .lu-t{font-family:'Orbitron';font-size:15px;letter-spacing:.16em;margin-bottom:14px}
  .lu-gains{font-size:14px;color:var(--green);letter-spacing:.05em;margin:4px 0}
  .lu-rank{margin-top:12px;font-size:13px;color:var(--gold);letter-spacing:.1em}

  .tier-banner{font-size:12px;letter-spacing:.04em;color:var(--gold);border:1px dashed rgba(251,191,36,0.4);
    border-radius:2px;padding:9px 11px;margin:2px 0 12px;background:rgba(251,191,36,0.05)}
  .hist-row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;
    border-bottom:1px dashed rgba(77,163,255,0.14);cursor:pointer;font-size:14px}
  .hist-row:last-child{border-bottom:none}
  .hist-row .hr-n{font-family:'Orbitron';font-size:13px;letter-spacing:.06em}
  .hist-row .hr-c{font-size:12px;color:var(--muted)}
  .hist-back{font-size:11px;color:var(--cyan-soft);letter-spacing:.1em;margin-bottom:10px;cursor:pointer;
    text-decoration:underline;display:inline-block;text-transform:uppercase}

  .msg-scroll{-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--cyan) rgba(11,20,40,0.3)}
  .msg-scroll::-webkit-scrollbar{width:6px}
  .msg-scroll::-webkit-scrollbar-track{background:rgba(11,20,40,0.3);border-radius:3px}
  .msg-scroll::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:3px}

  .tabbar{display:flex;gap:4px;margin:0 0 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab-btn{position:relative;flex:1;min-width:0;text-align:center;font-family:'Orbitron';font-size:9px;letter-spacing:.02em;
    text-transform:uppercase;color:var(--muted);background:rgba(11,20,40,0.5);border:1px solid rgba(77,163,255,0.25);
    border-radius:2px;padding:9px 2px;cursor:pointer;user-select:none;transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab-btn[data-active="1"]{color:var(--cyan-soft);border-color:var(--cyan);background:rgba(77,163,255,0.12);
    box-shadow:0 0 14px rgba(77,163,255,0.18)}
  .tab-dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--red);
    box-shadow:0 0 6px var(--red),0 0 2px var(--red);animation:dotpulse 1.6s ease-in-out infinite}
  @keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.45}}

  .foot{text-align:center;font-size:11px;color:#3a4964;letter-spacing:.18em;margin-top:4px;text-transform:uppercase}
  .reset{background:none;border:none;color:#3a4964;font-size:11px;letter-spacing:.1em;text-decoration:underline;
    margin-top:10px;display:block;width:100%;text-align:center}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<div id="toast"><div class="toast-win"><div class="th" id="toast-h">Notification</div><div class="tb" id="toast-b"></div></div></div>

<div id="overlay">
  <div class="levelup">
    <div class="lu-k">System Notification</div>
    <div class="lu-n" id="lu-n">2</div>
    <div class="lu-t">LEVEL UP</div>
    <div id="lu-gains"></div>
    <div class="lu-rank" id="lu-rank"></div>
    <button class="btn" style="margin-top:18px" onclick="closeLevelUp()">Continue</button>
  </div>
</div>

<div id="boxOverlay">
  <div class="levelup">
    <div class="lu-k">Mystery Box</div>
    <div class="box-ic">📦</div>
    <div class="lu-t">7-DAY STREAK REWARD</div>
    <div id="box-item"></div>
    <button class="btn" style="margin-top:18px" onclick="closeBoxReveal()">Continue</button>
  </div>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none" onchange="handleImportFile(this)">

<div id="viewBar" style="display:none;position:sticky;top:0;z-index:70;background:rgba(139,92,246,0.18);border-bottom:1px solid var(--violet);padding:10px 14px;text-align:center;font-family:'Orbitron';font-size:11px;letter-spacing:.06em;color:#c9b3ff"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    onAuthStateChanged, signOut

async function loadFriendsData(){
  if(!currentUid) return;
  try{
    const col = window.fb.collection(window.fb.db,'friendRequests');
    const [outQ, inQ, accFromQ, accToQ] = await Promise.all([
      window.fb.getDocs(window.fb.query(col, window.fb.where('fromUid','==',currentUid), window.fb.where('status','==','pending'))),
      window.fb.getDocs(window.fb.query(col, window.fb.where('toUid','==',currentUid), window.fb.where('status','==','pending'))),
      window.fb.getDocs(window.fb.query(col, window.fb.where('fromUid','==',currentUid), window.fb.where('status','==','accepted'))),
      window.fb.getDocs(window.fb.query(col, window.fb.where('toUid','==',currentUid), window.fb.where('status','==','accepted')))
    ]);
    outgoingPendingUids = new Set();
    outQ.forEach(d=>outgoingPendingUids.add(d.data().toUid));
    incomingPendingUids = new Set();
    incomingRequests = [];
    inQ.forEach(d=>{ const v=d.data(); incomingPendingUids.add(v.fromUid); incomingRequests.push({reqId:d.id, uid:v.fromUid, username:v.fromUsername}); });
    const accepted = [];
    accFromQ.forEach(d=>{ const v=d.data(); accepted.push({reqId:d.id, uid:v.toUid, username:v.toUsername}); });
    accToQ.forEach(d=>{ const v=d.data(); accepted.push({reqId:d.id, uid:v.fromUid, username:v.fromUsername}); });
    friendUids = new Set(accepted.map(f=>f.uid));
    const stats = await Promise.all(accepted.map(async f=>{
      try{
        const snap = await window.fb.getDoc(window.fb.doc(window.fb.db,'users',f.uid));
        if(snap.exists()){
          const u = snap.data();
          return Object.assign({}, f, { trainedDays: Object.keys(u.history||{}).length, streak: u.streak||0 });
        }
      }catch(e){}
      return Object.assign({}, f, { trainedDays: 0, streak: 0 });
    }));
    stats.sort((a,b)=>a.username.localeCompare(b.username));
    friendsList = stats;
    const el = document.getElementById('friendsSlot');
    if(el) el.innerHTML = buildFriendsSectionsHtml();
    renderChatMessages();
  }catch(e){
    const el = document.getElementById('friendsSlot');
    if(el) el.innerHTML = '<p class="note">Could not load friends.</p>';
  }
}
function buildFriendsSectionsHtml(){
  let html = '';
  if(incomingRequests.length){
    html += `
    <section class="win">
      <div class="eyebrow">Friend Requests</div>
      ${incomingRequests.map(r=>`
        <div class="hist-row" style="cursor:default">
          <span class="hr-n">${esc(r.username)}</span>
          <span style="display:flex;gap:8px;flex:0 0 auto">
            <button class="btn ghost sm" style="margin:0;padding:6px 10px" onclick="acceptFriendRequest('${r.reqId}')">Accept</button>
            <button class="btn ghost sm" style="margin:0;padding:6px 10px" onclick="declineFriendRequest('${r.reqId}')">Decline</button>
          </span>
        </div>`).join('')}
    </section>`;
  }
  html += `
    <section class="win">
      <div class="eyebrow">Friends</div>
      ${friendsList.length ? friendsList.map(f=>`
        <div class="hist-row" style="cursor:default">
          <span onclick="openDm('${f.uid}','${esc(f.username)}')" style="cursor:pointer;display:flex;flex:1;justify-content:space-between;align-items:center;gap:8px">
            <span class="hr-n">${esc(f.username)}</span>
            <span class="hr-c">${f.trainedDays}d trained - ${f.streak}d streak</span>
          </span>
          <span style="display:flex;gap:8px;flex:0 0 auto;margin-left:10px">
            <button class="btn ghost sm" style="margin:0;padding:6px 10px" onclick="openDm('${f.uid}','${esc(f.username)}')">Message</button>
            <button class="btn ghost sm" style="margin:0;padding:6px 10px" onclick="removeFriend('${f.reqId}','${f.uid}','${esc(f.username)}')">Remove</button>
          </span>
        </div>`).join('') : '<p class="note">No friends yet - add someone from the chat below.</p>'}
    </section>`;
  return html;
}

function startChatListener(){
  if(chatUnsub) return;
  const q = window.fb.query(window.fb.collection(window.fb.db,'messages'), window.fb.orderBy('timestamp','desc'), window.fb.limit(100));
  chatUnsub = window.fb.onSnapshot(q, (snap)=>{

function lastSeenKey(uid){ return 'ascension_lastseen_'+uid; }
function markChatSeen(id){
  lastSeenChatId = id;
  if(currentUid) store.set(lastSeenKey(currentUid), id);
  if(hasUnreadChat){ hasUnreadChat = false; renderTabBar(); }
}
function startUnreadWatcher(){
  if(unreadUnsub || !currentUid) return;
  lastSeenChatId = store.get(lastSeenKey(currentUid));
  const q = window.fb.query(window.fb.collection(window.fb.db,'messages'), window.fb.orderBy('timestamp','desc'), window.fb.limit(1));
  unreadUnsub = window.fb.onSnapshot(q, (snap)=>{
    if(snap.empty) return;
    const latest = snap.docs[0];
    const data = latest.data();
    if(currentTab==='social' && !viewOnly && !dmWith){ markChatSeen(latest.id); return; }
    if(data.uid===currentUid){ lastSeenChatId = latest.id; if(currentUid) store.set(lastSeenKey(currentUid), latest.id); return; }
    if(latest.id!==lastSeenChatId){ hasUnreadChat = true; renderTabBar(); }
  }, ()=>{});
}
function startRequestWatcher(){
  if(reqWatchUnsub || !currentUid) return;
  const q = window.fb.query(window.fb.collection(window.fb.db,'friendRequests'), window.fb.where('toUid','==',currentUid), window.fb.where('status','==','pending'));
  reqWatchUnsub = window.fb.onSnapshot(q, (snap)=>{
    hasUnreadRequest = !snap.empty;
    renderTabBar();
  }, ()=>{});
}
function stopRequestWatcher(){

function stopUnreadWatcher(){

}
function gateBtn(id,activeId){

  return `<div class="gate" data-color="${g.color}" data-active="${activeId===id?1:0}">
    <div class="g-ic">${g.icon}</div><div class="g-nm">${g.name}</div><div class="g-sub">${g.sub.split(' - ')[0]}</div></div>`;

function toggleEx(i){
  const gateId=todaysGate();
  const g=GATES[gateId];
  if(!g) return;
  const ex = effectiveGateExercises(S.day, gateId, levelFromXp(S.xp).lvl);
  const max=parseSets(ex[i].t);
  const cur=S.exSets[i]||0;
  S.exSets[i] = (cur+1)>max ? 0 : cur+1;
  save(); render();
}
function toggleDaily(k){ S.dailyDone[k]=!S.dailyDone[k]; save(); render(); }

function allChecked(){
  const gateId=todaysGate();
  const g=GATES[gateId];
  if(!g) return false;
  const ex = effectiveGateExercises(S.day, gateId, levelFromXp(S.xp).lvl);
  return ex.every((e,i)=>(S.exSets[i]||0)>=parseSets(e.t));
}
function completeGate(){
  const gateId=todaysGate();
  const g=GATES[gateId];
  if(!g || S.gateDoneToday) return;
  if(!allChecked()){
    toast('Quest incomplete','Complete every set to clear the Gate.');
    return;
  }
  const before=levelFromXp(S.xp).lvl;
  const trial = isTrialToday(S.day, gateId, levelFromXp(S.xp).lvl);
  const gained={}; gained[g.gain]=1;
  S.stats[g.gain]+=1;
  S._upStats=gained;
  S.xp += trial ? 120 : 100;
  bumpStreak();
  S.gateDoneToday=true;
  S.history[S.day] = {gate:gateId, xp:trial?120:100, trial:trial};
  save();
  const after=levelFromXp(S.xp).lvl;
  render();
  const penaltyXp=S._lastPenaltyXp; S._lastPenaltyXp=null;
  if(after>before){ showLevelUp(after,gained); }
  else if(trial){ toast('Trial Gate cleared','+120 XP - '+g.name+' complete.'); }
  else { toast('Gate cleared','+100 XP - '+g.name+' complete.'); }
  revealNewBox(after>before);
  if(penaltyXp){
    setTimeout(()=>{ toast('Streak broken','-'+penaltyXp+' XP penalty. Stats suppressed today.'); }, after>before?400:3000);
  }
  setTimeout(()=>{ S._upStats=null; },1800);
}
function completeRestDay(){
  if(viewOnly) return;

    setTimeout(()=>{ toast('Streak broken','-'+penaltyXp+' XP penalty. Stats suppressed today.'); }, 3000);
  }
}
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
function historyDrill(level,year,month){
  historyNav = {level, year:year||null, month:month||null};
  historyOpen = true;

}
function buildHistory(){
  const dates = Object.keys(S.history||{}).sort().reverse();
  if(!dates.length) return '<p class="note">No entries yet - clear a Gate to begin your Ascension Log.</p>';

  if(historyNav.level==='years'){
    const years={};
    dates.forEach(d=>{ const y=d.slice(0,4); years[y]=(years[y]||0)+1; });
    return Object.keys(years).sort().reverse().map(y=>`
      <div class="hist-row" onclick="historyDrill('months','${y}')">
        <span class="hr-n">${y}</span><span class="hr-c">${years[y]} day${years[y]===1?'':'s'} trained</span>
      </div>`).join('');
  }

  if(historyNav.level==='months'){
    const y=historyNav.year;
    const months={};
    dates.filter(d=>d.slice(0,4)===y).forEach(d=>{ const m=d.slice(0,7); months[m]=(months[m]||0)+1; });
    return `<div class="hist-back" onclick="historyDrill('years')">&larr; All years</div>` +
      Object.keys(months).sort().reverse().map(m=>{
        const mi=parseInt(m.slice(5,7),10)-1;
        return `<div class="hist-row" onclick="historyDrill('days','${y}','${m}')">
          <span class="hr-n">${MONTH_NAMES[mi]}</span><span class="hr-c">${months[m]} day${months[m]===1?'':'s'} trained</span>
        </div>`;
      }).join('');
  }

  if(historyNav.level==='days'){
    const m=historyNav.month;
    const mi=parseInt(m.slice(5,7),10)-1;
    const dayList=dates.filter(d=>d.slice(0,7)===m);
    return `<div class="hist-back" onclick="historyDrill('months','${historyNav.year}')">&larr; ${MONTH_NAMES[mi]} ${historyNav.year}</div>` +
      dayList.map(d=>{
        const h=S.history[d];
        const w=S.weightLog?S.weightLog[d]:null;
        let line=`${GATES[h.gate].name} ${h.manual?'(logged manually)':'cleared (+'+h.xp+' XP)'}`;
        if(w!=null) line+=` &middot; Weight ${fmt(w)} kg`;
        return `<p style="margin:0 0 8px;font-size:13px"><b style="color:var(--cyan-soft)">${d}</b> - ${line}</p>`;
      }).join('');
  }
}
function logPastWorkout(){
  if(viewOnly) return;
  const d = document.getElementById('pastDate').value;
  const g = document.getElementById('pastGate').value;
  const awardXp = document.getElementById('pastAwardXp').checked;
  const wRaw = document.getElementById('pastWeight').value;
  if(!d){ toast('Missing date','Pick a date first.'); return; }
  if(d > today()){ toast('Invalid date','Cannot log a future date.'); return; }
  const existing = S.history[d];
  if(existing && !confirm('This date already has an entry. Overwrite it?')) return;
  const alreadyAwarded = !!(existing && existing.xpAwarded);
  const willAward = awardXp && !alreadyAwarded;

  const beforeLvl = levelFromXp(S.xp).lvl;
  let xpGain = 0;
  const gains = {};
  if(willAward){
    const gate = GATES[g];
    S.stats[gate.gain]=(S.stats[gate.gain]||0)+1; gains[gate.gain]=(gains[gate.gain]||0)+1;
    S.stats.vit=(S.stats.vit||0)+1; gains.vit=(gains.vit||0)+1;
    xpGain += 130;
  }
  const w = parseFloat(wRaw);
  const weightOk = !isNaN(w) && w>=30 && w<=250;
  if(willAward && weightOk){
    S.weightLog[d] = w;
    xpGain += 10;
  }
  S.xp += xpGain;
  S.history[d] = {gate:g, xp:xpGain, manual:true, xpAwarded:willAward};

  let streakUpdated = false;
  if(S.lastActive==null || d===nextDay(S.lastActive)){
    S.streak = (S.lastActive==null) ? 1 : S.streak+1;
    S.lastActive = d;
    streakUpdated = true;
  }
  if(willAward) S._upStats = gains;
  save();
  const afterLvl = levelFromXp(S.xp).lvl;
  render();
  if(afterLvl>beforeLvl){
    showLevelUp(afterLvl, gains);
  } else {
    let msg = GATES[g].name+' added to your history for '+d+'.';
    if(willAward) msg = '+'+xpGain+' XP - '+msg;
    else if(awardXp && alreadyAwarded) msg += ' XP was already awarded for this date previously.';
    if(streakUpdated) msg += ' Streak updated.';
    toast('Logged', msg);
  }
  if(willAward) setTimeout(()=>{ S._upStats=null; },1800);
}
function claimDaily(){
  if(S.dailyClaimed) return;
  if(!(S.dailyDone.grip&&S.dailyDone.mystery)) return;
  const before=levelFromXp(S.xp).lvl;
  S.xp+=30; S.dailyClaimed=true;
  S.stats.vit+=1; S._upStats={vit:1};
  bumpStreak();
  save();
  const after=levelFromXp(S.xp).lvl;
  render();
  const penaltyXp=S._lastPenaltyXp; S._lastPenaltyXp=null;
  if(after>before) showLevelUp(after,{vit:1});
  else toast('Discipline','+30 XP - hunter daily quest.');
  revealNewBox(after>before);
  if(penaltyXp){
    setTimeout(()=>{ toast('Streak broken','-'+penaltyXp+' XP penalty. Stats suppressed today.'); }, after>before?400:3000);
  }
  setTimeout(()=>{ S._upStats=null; },1800);
}
function toggleMobility(){ S.mobilityDone=!S.mobilityDone; save(); render(); }
function claimMobility(){
  if(S.mobilityClaimed) return;
  if(!S.mobilityDone) return;
  const before=levelFromXp(S.xp).lvl;
  S.xp+=20; S.mobilityClaimed=true;
  save();
  const after=levelFromXp(S.xp).lvl;
  render();
  if(after>before) showLevelUp(after,{});
  else toast('Flexibility','+20 XP - flexibility work done.');
}
function buildWeightChart(){
  const entries = Object.entries(S.weightLog||{}).sort((a,b)=>a[0]<b[0]?-1:1);
  if(entries.length<2) return '<p class="note">Log your weight on at least 2 different days to see your trend.</p>';
  const W=300,H=110,padX=10,padY=14;
  const weights = entries.map(e=>e[1]);
  let minW=Math.min(...weights), maxW=Math.max(...weights);
  const rangePad=(maxW-minW)*0.15 || 1;
  minW-=rangePad; maxW+=rangePad;
  const n=entries.length;
  const x = i => padX + (n===1?0:(i/(n-1))*(W-2*padX));
  const y = w => padY + (1-(w-minW)/(maxW-minW))*(H-2*padY);
  const points = entries.map((e,i)=>`${x(i).toFixed(1)},${y(e[1]).toFixed(1)}`).join(' ');
  const dots = entries.map((e,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(e[1]).toFixed(1)}" r="3" fill="#4da3ff" stroke="#05070f" stroke-width="1" style="cursor:pointer" onclick="toast('${e[0]}','${fmt(e[1])} kg')"><title>${e[0]}: ${fmt(e[1])} kg</title></circle>`).join('');
  const first=entries[0][1], last=entries[n-1][1], delta=last-first;
  const goingUp = S.goalW>=S.startW;
  const good = goingUp ? delta>=0 : delta<=0;
  const deltaTxt=(delta>=0?'+':'')+fmt(delta)+' kg since '+entries[0][0];
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <polyline points="${points}" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em">
      <span>${entries[0][0]}</span><span>${entries[n-1][0]}</span>
    </div>
    <div style="font-size:12px;color:${good?'var(--green)':'var(--red)'};margin-top:6px;text-align:center;letter-spacing:.04em">${deltaTxt}</div>
  `;
}
function saveProfileEdit(){
  if(viewOnly) return;
  const name=(document.getElementById('editName').value||S.name).trim();
  const sw=parseFloat(document.getElementById('editStartW').value);
  const gw=parseFloat(document.getElementById('editGoalW').value);
  if(isNaN(sw)||isNaN(gw)){ toast('Invalid entry','Enter valid numbers for both weights.'); return; }
  S.name=name||S.name; S.startW=sw; S.goalW=gw;
  save(); render();
  toast('Updated','Profile and goal updated.');
}
function logWeight(){
  if(S.weightLog[S.day]!=null){ toast('Already logged','You already logged your weight today.'); return; }
  const v=parseFloat(document.getElementById('wIn').value);
  if(isNaN(v)||v<30||v>250){ toast('Invalid entry','Enter a valid weight in kg.'); return; }
  const prev=S.weight; S.weight=v;
  S.weightLog[S.day]=v;
  const goingUp = S.goalW>=S.startW;
  const progressed = goingUp ? v>prev : v<prev;
  save();
  if(progressed){
    S.xp+=10;
    save(); render();
    toast('Ascension','Weight logged - +10 XP');
  } else { render(); toast('Logged','Weight updated.'); }
}
function bumpStreak(){
  if(S.lastActive===today()) return;
  const y=yesterday();
  const broke = S.lastActive!=null && S.lastActive!==y && S.streak>0;
  if(broke) applyStreakPenalty();
  S.streak = (S.lastActive===y) ? S.streak+1 : 1;
  S.lastActive=today();
  if(S.streak>0 && S.streak%7===0 && S.streak>(S.lastBoxStreak||0)){
    const item = pickBoxItem(S.streak, S.day);
    if(!S.avatarItems) S.avatarItems=[];
    S.avatarItems.push(item.id);
    S.lastBoxStreak = S.streak;
    S._newBoxItem = item;
  }
}
function applyStreakPenalty(){
  const info = levelFromXp(S.xp);
  const xpLoss = Math.min(50, info.into);
  if(xpLoss<=0) return; // nothing to take from a 0-XP account - skip silently, no fake penalty banner
  S.xp -= xpLoss;
  S.penaltyToday = true;
  S._lastPenaltyXp = xpLoss;
}

let toastT;
function toast(h,b){
  document.getElementById('toast-h').textContent=h;
  document.getElementById('toast-b').textContent=b;
  const t=document.getElementById('toast'); t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800);
}
function showLevelUp(lvl,gains){
  document.getElementById('lu-n').textContent=lvl;
  const map={str:'Strength',vit:'Vitality',end:'Endurance',agi:'Agility'};
  document.getElementById('lu-gains').innerHTML =
    Object.keys(gains).map(k=>`<div class="lu-gains">${map[k]} +${gains[k]}</div>`).join('');
  const rk=rankFor(lvl);
  document.getElementById('lu-rank').textContent='Current rank: '+rk.lbl.toUpperCase();
  document.getElementById('overlay').classList.add('show');
}
function closeLevelUp(){
  document.getElementById('overlay').classList.remove('show');
  if(pendingBoxReveal){ const item=pendingBoxReveal; pendingBoxReveal=null; showBoxReveal(item); }
}
let pendingBoxReveal = null;
function showBoxReveal(item){
  document.getElementById('box-item').innerHTML =
    `<div class="box-item"><span class="bi-icon">${item.icon}</span><span class="bi-name">${esc(item.name)}</span><span class="bi-kind">${esc(item.kind)}</span></div>`;
  document.getElementById('boxOverlay').classList.add('show');
}
function closeBoxReveal(){ document.getElementById('boxOverlay').classList.remove('show'); render(); }
function revealNewBox(leveledUp){
  if(!S._newBoxItem) return;
  const item = S._newBoxItem; S._newBoxItem = null;
  if(leveledUp) pendingBoxReveal = item;
  else showBoxReveal(item);
}

function renderOnboarding(){
  app.innerHTML = `
    <div style="text-align:center;margin:24px 0 10px">
      <div class="eyebrow" style="justify-content:center">System Notification</div>
    </div>
    <section class="win">
      <div style="text-align:center;margin-bottom:6px">
        <div style="font-family:'Orbitron';font-size:13px;letter-spacing:.1em;color:var(--cyan-soft)">You have been selected</div>
        <h1 class="title-xl" style="margin:8px 0">as a Player</h1>
        <p style="color:var(--muted);font-size:14px;letter-spacing:.03em;margin:8px 0 4px">
          Only you can see the System. Log your starting point and begin to ascend.</p>
        <p style="color:var(--cyan-soft);font-size:12px;letter-spacing:.06em;margin-top:6px">Registering as <b>${esc(myUsername||'')}</b></p>
      </div>
      <label>Hunter name</label>
      <input id="o-name" placeholder="Your name" value="Txetxe">
      <div style="display:flex;gap:10px">
        <div style="flex:1"><label>Current weight (kg)</label><input id="o-w" type="number" inputmode="decimal" step="0.1" value="75"></div>
        <div style="flex:1"><label>Goal (kg)</label><input id="o-g" type="number" inputmode="decimal" step="0.1" value="82"></div>
      </div>
      <button class="btn" onclick="startGame()">Accept the quest</button>
      <button class="btn ghost" style="margin-top:10px" onclick="document.getElementById('importFile').click()">Restore from a backup file</button>
    </section>
    <div class="foot">The system is watching.</div>
  `;
}
function startGame(){
  const name=(document.getElementById('o-name').value||'Hunter').trim();
  const w=parseFloat(document.getElementById('o-w').value);
  const g=parseFloat(document.getElementById('o-g').value);
  if(isNaN(w)||isNaN(g)){ toast('Missing data','Enter current weight and goal.'); return; }
  S={
    name, startW:w, weight:w, goalW:g,
    xp:0, stats:{str:10,vit:10,end:10,agi:10},
    startDate:today(), cycleIndex:0, exSets:{}, gateDoneToday:false, tzMigrated:true,
    dailyDone:{grip:false,mystery:false}, dailyClaimed:false,
    mobilityDone:false, mobilityClaimed:false,
    streak:0, questOnlyStreak:0, avatarItems:[], lastBoxStreak:0, lastActive:null, day:today(),
    history:{}, weightLog:{},
    username: myUsername||'', isAdmin:false
  };
  myIsAdmin = false;
  save(); render();
  toast('System online','Welcome, '+name+'. Let the ascension begin.');
}
function hardReset(){
  if(viewOnly) return;
  if(confirm('Erase all progress and awaken again?')){
    if(currentUid) store.del(cloudKey(currentUid));
    S=null; render();
  }
}

function exportProgress(){
  if(!S){ toast('Nothing to back up','Start your journey first.'); return; }
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ascension-backup-'+S.day+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup saved','Keep this file somewhere safe - iCloud Drive, email, etc.');
}
function handleImportFile(input){
  if(viewOnly){ toast('Not allowed','Exit the read-only view first.'); input.value=''; return; }
  if(!currentUid){ toast('Log in first','Create or sign in to an account before restoring a backup.'); input.value=''; return; }
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ toast('Import failed','That file is not valid JSON.'); return; }
    if(!parsed || typeof parsed.xp!=='number' || !parsed.stats || typeof parsed.name!=='string'){
      toast('Import failed','That file is not a valid Ascension System backup.');
      return;
    }
    if(S && !confirm('This will overwrite your current progress with the backup file. Continue?')) return;
    parsed.tzMigrated = true;
    parsed.username = myUsername || parsed.username || '';
    if(parsed.isAdmin===undefined) parsed.isAdmin = myIsAdmin;
    S = parsed;
    save();
    render();
    toast('Restored','Your backup has been loaded.');
  };
  reader.readAsText(file);
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return (Math.round(n*10)/10).toString(); }

function startAuthListener(){
  window.fb.onAuthStateChanged(window.fb.auth, onAuthReady);
}
if(window.fb){ startAuthListener(); }
else { window.addEventListener('fbready', startAuthListener); }
</script>
