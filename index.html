<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05070f">
<!-- iOS PWA (full screen when added to Home Screen) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="System">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.json">
<title>Ascension System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070f;
    --panel:rgba(11,20,40,0.72);
    --cyan:#4da3ff;
    --cyan-soft:#7cc4ff;
    --violet:#8b5cf6;
    --gold:#fbbf24;
    --red:#ef4444;
    --green:#34d399;
    --ink:#dbeafe;
    --muted:#7c8aa5;
    --line:rgba(77,163,255,0.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Rajdhani',system-ui,sans-serif;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(77,163,255,0.10), transparent 60%),
      radial-gradient(900px 600px at 90% 110%, rgba(139,92,246,0.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    min-height:100vh;
    padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    line-height:1.35;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
    background-image:
      linear-gradient(rgba(77,163,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,163,255,0.06) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image:radial-gradient(circle at 50% 20%, #000 30%, transparent 85%);
  }
  #app{position:relative;z-index:1;max-width:520px;margin:0 auto}

  h1,h2,h3,.sys,.rank,.lvl,.stat-val{font-family:'Orbitron',sans-serif}

  .win{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:2px;
    padding:16px 16px 14px;
    margin:0 0 14px;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    box-shadow:0 0 22px rgba(77,163,255,0.10), inset 0 0 30px rgba(77,163,255,0.04);
  }
  .win::before,.win::after{
    content:"";position:absolute;width:14px;height:14px;pointer-events:none;
    border:2px solid var(--cyan);
  }
  .win::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
  .win::after{bottom:-1px;right:-1px;border-left:none;border-top:none}

  .eyebrow{
    font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.32em;
    color:var(--cyan);text-transform:uppercase;
    text-shadow:0 0 12px rgba(77,163,255,0.6);
    margin:0 0 10px;display:flex;align-items:center;gap:8px;
  }
  .eyebrow::before{content:"\201C";opacity:.8}
  .eyebrow::after{content:"\201D";opacity:.8;margin-left:auto}

  .title-xl{font-size:26px;font-weight:900;letter-spacing:.04em;margin:0;
    text-shadow:0 0 18px rgba(77,163,255,0.45)}

  .hunter-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .hname{font-family:'Orbitron';font-weight:700;font-size:19px;letter-spacing:.03em;margin:2px 0 2px}
  .rank{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:52px;height:52px;font-size:26px;font-weight:900;
    border:1.5px solid var(--gold);color:var(--gold);border-radius:3px;
    text-shadow:0 0 14px rgba(251,191,36,0.6);box-shadow:0 0 18px rgba(251,191,36,0.18);
    background:rgba(251,191,36,0.06);flex-direction:column;line-height:1;
  }
  .rank small{display:block;font-family:'Rajdhani';font-size:8px;letter-spacing:.2em;color:var(--muted);
    text-shadow:none;margin-top:1px}
  .lvl{font-size:13px;color:var(--cyan-soft);letter-spacing:.14em}
  .lvl b{color:#fff;font-size:16px}
  .title-line{font-size:12px;color:var(--gold);font-style:italic;letter-spacing:.03em;margin-top:3px}

  .bar{height:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(77,163,255,0.25);
    border-radius:2px;overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;width:0;border-radius:0;
    background:linear-gradient(90deg,var(--cyan),var(--violet));
    box-shadow:0 0 14px rgba(77,163,255,0.6);transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .bar-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
    letter-spacing:.08em;margin-top:5px;text-transform:uppercase}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
  .stat{border:1px solid rgba(77,163,255,0.22);border-radius:2px;padding:9px 11px;
    background:rgba(77,163,255,0.04);display:flex;justify-content:space-between;align-items:center}
  .stat .k{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .stat .stat-val{font-size:18px;color:#fff;text-shadow:0 0 10px rgba(77,163,255,0.4)}
  .stat.up .stat-val{color:var(--green);text-shadow:0 0 12px rgba(52,211,153,0.7)}
  .stat.down .stat-val{color:var(--red);text-shadow:0 0 12px rgba(239,68,68,0.7)}

  .weight-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  .weight-now{font-family:'Orbitron';font-size:28px;font-weight:700;color:#fff}
  .weight-now span{font-size:14px;color:var(--muted);font-weight:500}
  .weight-goal{font-size:13px;color:var(--cyan-soft);letter-spacing:.06em}

  .gates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px}
  .gate{border:1px solid rgba(77,163,255,0.3);border-radius:2px;padding:10px 4px;text-align:center;
    cursor:pointer;background:rgba(11,20,40,0.5);transition:.15s;user-select:none}
  .gate .g-ic{font-size:18px;line-height:1}
  .gate .g-nm{font-family:'Orbitron';font-size:10px;letter-spacing:.1em;margin-top:5px;color:var(--muted)}
  .gate .g-sub{font-size:9px;color:#4a5b76;letter-spacing:.05em;margin-top:1px}
  .gate[data-active="1"]{border-color:var(--cyan);background:rgba(77,163,255,0.12);
    box-shadow:0 0 16px rgba(77,163,255,0.2)}
  .gate[data-active="1"] .g-nm{color:var(--cyan-soft)}
  .gate[data-color="red"][data-active="1"]{border-color:#ff6b6b;box-shadow:0 0 16px rgba(255,107,107,.2)}
  .gate[data-color="violet"][data-active="1"]{border-color:var(--violet);box-shadow:0 0 16px rgba(139,92,246,.2)}

  ul.ex{list-style:none;margin:6px 0 0;padding:0}
  ul.ex li{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px dashed rgba(77,163,255,0.14);
    cursor:pointer;transition:.12s}
  ul.ex li:last-child{border-bottom:none}
  .chk{flex:0 0 auto;width:22px;height:22px;border:1.5px solid var(--cyan);border-radius:2px;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:.15s}
  li.done .chk{background:rgba(77,163,255,0.18);color:var(--cyan);box-shadow:0 0 12px rgba(77,163,255,.5)}
  li.done .ex-nm{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(124,138,165,.6)}
  .ex-nm{font-size:15px;font-weight:600}
  .ex-tg{font-size:12px;color:var(--cyan-soft);letter-spacing:.04em;font-weight:600}
  .ex-nm small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.02em}

  button{font-family:'Rajdhani',sans-serif;cursor:pointer}
  .btn{
    width:100%;font-family:'Orbitron';font-weight:700;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--bg);background:linear-gradient(90deg,var(--cyan),var(--cyan-soft));
    border:none;border-radius:2px;padding:14px;margin-top:14px;
    box-shadow:0 0 20px rgba(77,163,255,0.4);transition:.15s;
  }
  .btn:active{transform:translateY(1px)}
  .btn:disabled{background:rgba(77,163,255,0.15);color:var(--muted);box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--cyan-soft);border:1px solid var(--line);box-shadow:none;
    letter-spacing:.1em}
  .btn.sm{width:auto;padding:9px 14px;font-size:11px;margin:0}

  .daily{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .dq{display:flex;align-items:center;gap:11px;padding:9px 4px;cursor:pointer}
  .dq .chk{width:20px;height:20px;font-size:12px}
  .dq .t{font-size:14px;font-weight:600}
  .dq .t small{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .penalty{margin-top:10px;font-size:11px;letter-spacing:.08em;color:var(--red);
    border:1px dashed rgba(239,68,68,0.4);border-radius:2px;padding:8px 10px;
    background:rgba(239,68,68,0.05);text-transform:uppercase}
  .streak{font-family:'Orbitron';font-size:12px;color:var(--gold);letter-spacing:.08em;text-align:right;
    margin-top:2px;text-shadow:0 0 12px rgba(251,191,36,.4)}

  label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    margin:14px 0 6px}
  input,select{width:100%;background:rgba(5,7,15,0.7);border:1px solid var(--line);border-radius:2px;
    color:#fff;font-family:'Rajdhani';font-size:17px;font-weight:600;padding:12px 13px;outline:none}
  input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(77,163,255,0.25)}
  .inline-w{display:flex;gap:10px;align-items:flex-end}
  .inline-w input{flex:1}

  details.guide{margin-top:2px}
  details.guide summary{list-style:none;cursor:pointer;font-family:'Orbitron';font-size:11px;
    letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:8px}
  details.guide summary::-webkit-details-marker{display:none}
  details.guide summary::after{content:"\25B8";margin-left:auto;transition:.2s}
  details.guide[open] summary::after{transform:rotate(90deg)}
  .guide-body{font-size:14px;color:#c7d6ee;margin-top:12px}
  .guide-body p{margin:0 0 10px}
  .guide-body b{color:var(--cyan-soft)}
  .guide-body .note{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}

  #toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-140%);
    opacity:0;visibility:hidden;
    z-index:60;max-width:460px;width:calc(100% - 28px);pointer-events:none;
    transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s ease,visibility 0s linear .45s}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;
    transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s ease}
  .toast-win{background:rgba(9,16,33,0.95);border:1px solid var(--cyan);border-radius:2px;padding:12px 14px;
    box-shadow:0 0 26px rgba(77,163,255,0.45)}
  .toast-win .th{font-family:'Orbitron';font-size:10px;letter-spacing:.28em;color:var(--cyan);
    text-transform:uppercase;margin-bottom:4px}
  .toast-win .tb{font-size:15px;font-weight:600}

  #overlay{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,rgba(77,163,255,0.14),rgba(5,7,15,0.94));
    display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
  #overlay.show{display:flex}
  .levelup{max-width:360px;width:100%;text-align:center;border:1px solid var(--cyan);border-radius:3px;
    background:rgba(9,16,33,0.9);padding:28px 22px;box-shadow:0 0 40px rgba(77,163,255,0.5);
    animation:pop .4s cubic-bezier(.2,1.2,.3,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .levelup .lu-k{font-family:'Orbitron';font-size:11px;letter-spacing:.3em;color:var(--cyan);text-transform:uppercase}
  .levelup .lu-n{font-family:'Orbitron';font-size:52px;font-weight:900;color:var(--gold);line-height:1;margin:8px 0 4px;
    text-shadow:0 0 26px rgba(251,191,36,0.7);animation:glow 1.4s ease-in-out infinite alternate}
  @keyframes glow{to{text-shadow:0 0 40px rgba(251,191,36,0.95)}}
  .levelup .lu-t{font-family:'Orbitron';font-size:15px;letter-spacing:.16em;margin-bottom:14px}
  .lu-gains{font-size:14px;color:var(--green);letter-spacing:.05em;margin:4px 0}
  .lu-rank{margin-top:12px;font-size:13px;color:var(--gold);letter-spacing:.1em}

  .tier-banner{font-size:12px;letter-spacing:.04em;color:var(--gold);border:1px dashed rgba(251,191,36,0.4);
    border-radius:2px;padding:9px 11px;margin:2px 0 12px;background:rgba(251,191,36,0.05)}
  .hist-row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;
    border-bottom:1px dashed rgba(77,163,255,0.14);cursor:pointer;font-size:14px}
  .hist-row:last-child{border-bottom:none}
  .hist-row .hr-n{font-family:'Orbitron';font-size:13px;letter-spacing:.06em}
  .hist-row .hr-c{font-size:12px;color:var(--muted)}
  .hist-back{font-size:11px;color:var(--cyan-soft);letter-spacing:.1em;margin-bottom:10px;cursor:pointer;
    text-decoration:underline;display:inline-block;text-transform:uppercase}

  .foot{text-align:center;font-size:11px;color:#3a4964;letter-spacing:.18em;margin-top:4px;text-transform:uppercase}
  .reset{background:none;border:none;color:#3a4964;font-size:11px;letter-spacing:.1em;text-decoration:underline;
    margin-top:10px;display:block;width:100%;text-align:center}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<div id="toast"><div class="toast-win"><div class="th" id="toast-h">Notification</div><div class="tb" id="toast-b"></div></div></div>

<div id="overlay">
  <div class="levelup">
    <div class="lu-k">System Notification</div>
    <div class="lu-n" id="lu-n">2</div>
    <div class="lu-t">LEVEL UP</div>
    <div id="lu-gains"></div>
    <div class="lu-rank" id="lu-rank"></div>
    <button class="btn" style="margin-top:18px" onclick="closeLevelUp()">Continue</button>
  </div>
</div>

<script>
/* ---------- Safe storage (localStorage with in-memory fallback) ---------- */
const store = (()=>{
  let mem = {};
  let ok = false;
  try{ const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); ok=true; }catch(e){ ok=false; }
  return {
    get(k){ try{ return ok ? localStorage.getItem(k) : (mem[k]??null); }catch(e){ return mem[k]??null; } },
    set(k,v){ try{ ok ? localStorage.setItem(k,v) : (mem[k]=v); }catch(e){ mem[k]=v; } },
    del(k){ try{ ok ? localStorage.removeItem(k) : (delete mem[k]); }catch(e){ delete mem[k]; } }
  };
})();
const KEY='ascension_v1';

/* ---------- Gate data (your real split) ---------- */
const GATES = {
  push:{ name:'PUSH', sub:'Park - Calisthenics', icon:'\ud83d\udd34', color:'red',
    gains:{str:1,end:1},
    ex:[
      {n:'Parallel bar dips', t:'4x8-12', d:'Chest and triceps. Add weight once you own it.'},
      {n:'Push-ups (variations)', t:'4x10-15', d:'Alternate standard, decline and diamond.'},
      {n:'Weighted push-ups', t:'3x8-10', d:'Loaded backpack - your main overload.'},
      {n:'Pseudo-planche push-ups', t:'3x8', d:'Hands by hips, torso leaning. Shoulders.'},
      {n:'Pull-ups', t:'4x max', d:'You are at the park - add weight if reps pile up.'},
      {n:'Hanging leg raises', t:'3x10-12', d:'Core.'}
    ]},
  pull:{ name:'PULL', sub:'Dumbbells - Home', icon:'\ud83d\udd35', color:'cyan',
    gains:{str:1,agi:1},
    ex:[
      {n:'One-arm dumbbell row', t:'4x8-12', d:'Back - go heavy (up to 20 kg).'},
      {n:'Dumbbell biceps curl', t:'3x10-12', d:'Control the descent 2-3 s.'},
      {n:'Hammer curl', t:'3x10-12', d:'Brachialis and forearm.'},
      {n:'Rear-delt raises', t:'3x12-15', d:'Light weight, clean form.'},
      {n:'Shrugs', t:'3x12-15', d:'Traps.'}
    ]},
  legs:{ name:'LEGS', sub:'Dumbbells - Home', icon:'\ud83d\udfe3', color:'violet',
    gains:{str:1,vit:1},
    ex:[
      {n:'Goblet squat', t:'4x10-12', d:'One dumbbell at the chest. Deep and controlled.'},
      {n:'Bulgarian split squat', t:'3x8-10 /leg', d:'Dumbbells in hands. Gold with light weight.'},
      {n:'Romanian deadlift', t:'4x10-12', d:'Hips back, hamstrings and glutes.'},
      {n:'Walking lunges', t:'3x10 /leg', d:'With dumbbells.'},
      {n:'Calf raises', t:'4x15-20', d:'One dumbbell, full range.'}
    ]}
};
const RANKS = [
  {min:90,r:'S',lbl:'Rank S'},{min:70,r:'A',lbl:'Rank A'},{min:50,r:'B',lbl:'Rank B'},
  {min:30,r:'C',lbl:'Rank C'},{min:15,r:'D',lbl:'Rank D'},{min:0,r:'E',lbl:'Rank E'}
];
function rankFor(lvl){ return RANKS.find(x=>lvl>=x.min); }
const MAX_LEVEL = 100;
function xpNeeded(lvl){ return 180 + (lvl-1)*15; }
function levelFromXp(xp){
  let lvl=1, rem=xp;
  while(lvl<MAX_LEVEL && rem>=xpNeeded(lvl)){ rem-=xpNeeded(lvl); lvl++; }
  if(lvl>=MAX_LEVEL) return {lvl:MAX_LEVEL, into:0, need:0, maxed:true};
  return {lvl, into:rem, need:xpNeeded(lvl), maxed:false};
}

/* ---------- Title progression: absurd -> legendary, one per 10 levels ---------- */
const TITLES = [
  {min:1,   t:'Couch-Dwelling Weakling'},
  {min:10,  t:'Novice Dumbbell Wrangler'},
  {min:20,  t:'Park Bench Warrior'},
  {min:30,  t:'Apprentice Hunter'},
  {min:40,  t:'Iron-Willed Ascendant'},
  {min:50,  t:'Vanguard of the Gates'},
  {min:60,  t:'Silent Blade of Ascension'},
  {min:70,  t:'Sovereign of Iron and Shadow'},
  {min:80,  t:'Harbinger of the Ascended'},
  {min:90,  t:'Ruler of the Shadow Legion'},
  {min:100, t:'Monarch of Shadows'}
];
function titleFor(lvl){ let t=TITLES[0]; for(const x of TITLES){ if(lvl>=x.min) t=x; } return t; }

/* ---------- Progressive overload tiers, keyed off the Strength stat ---------- */
const OVERLOAD_TIERS = [
  {min:0,  label:'Foundation', tip:'Stick to the base sets and reps shown below.'},
  {min:20, label:'Tier I',     tip:'Add 1 extra set, or 2 extra reps, on every exercise.'},
  {min:30, label:'Tier II',    tip:'Slow the lowering (negative) phase to 3-4 seconds on every rep.'},
  {min:40, label:'Tier III',   tip:'Switch to single-limb variations where possible (one-arm, one-leg).'},
  {min:50, label:'Tier IV',    tip:'Add external weight (loaded backpack / heavier dumbbell) on top of everything above.'}
];
function overloadTierFor(str){
  let t = OVERLOAD_TIERS[0];
  for(const tier of OVERLOAD_TIERS){ if(str>=tier.min) t=tier; }
  return t;
}

/* ---------- Mystery daily quest pool ---------- */
const MYSTERY_QUESTS = [
  'Hold a plank for 60 seconds','Do 20 bodyweight squats before breakfast','Stretch your hamstrings for 5 minutes',
  'Take a 10-minute walk outside','Do 15 push-ups any time today','Drink 2.5+ liters of water today',
  'Avoid added sugar today','Hang from a bar for 30 seconds total','Foam roll or stretch your back for 5 minutes',
  'Do 20 jumping jacks to wake up','Take a cold shower for at least 30 seconds','Sit in silence for 5 minutes',
  'Hold a 1-minute wall sit','Do 10 arm circles each direction, each arm','Go to bed 30 minutes earlier than usual',
  'Avoid your phone for the first 30 minutes after waking','Do 10 slow air squats focusing on form',
  'Stretch your hip flexors for 3 minutes','Take the stairs instead of the elevator today','Do 20 calf raises',
  'Practice deep breathing for 3 minutes','Log everything you eat today','Hold a 2-minute plank (broken up if needed)',
  'Stretch your chest and shoulders for 5 minutes','Do 15 lunges per leg','Walk 5,000+ steps today',
  'Write down one thing you are grateful for','Do 10 burpees','Check and correct your posture 3 times today',
  'Do a 5-minute dynamic warm-up before any activity','Avoid sitting for more than 45 minutes at a stretch',
  'Do 20 mountain climbers','Stretch your neck and upper traps for 3 minutes','Prepare tomorrow\'s meals or snacks in advance',
  'Do 30 seconds of high knees','Read 5 pages of a book','Hold a 1-minute superman (lower back)',
  'Dead hang or squeeze a ball for 1 minute total','Do 15 tricep dips off a chair','Spend 5 minutes planning tomorrow\'s training',
  'Do 20 bicycle crunches','Stretch each quad for 3 minutes','Avoid caffeine after 4pm',
  'Do a 1-minute set of push-up negatives','Walk barefoot on grass for a few minutes','Do 10 slow, controlled push-up negatives',
  'Practice box breathing for 3 minutes (4-4-4-4)','Do 20 glute bridges','Reflect on one win from today\'s training',
  'Hold a 90-second plank to end the day strong'
];
function mysteryQuestFor(dateStr){
  let h=0;
  for(let i=0;i<dateStr.length;i++){ h = (h*31 + dateStr.charCodeAt(i)) >>> 0; }
  return MYSTERY_QUESTS[h % MYSTERY_QUESTS.length];
}

/* ---------- Fixed schedule: 6-on-1-off, starting as if day 0 already followed a Push day ---------- */
const CYCLE = ['push','pull','legs','push','pull','legs','rest'];
function parseSets(t){ const m=/^(\d+)\s*x/i.exec(t); return m? parseInt(m[1],10) : 1; }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/86400000); }
function scheduleFor(dateStr){
  const offset = daysBetween(S.startDate, dateStr) + 1;
  const idx = ((offset % 7) + 7) % 7;
  return CYCLE[idx];
}

/* ---------- State ---------- */
let S = load();
let historyNav = {level:'years', year:null, month:null};
function load(){
  const raw = store.get(KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return null;
}
function save(){ store.set(KEY, JSON.stringify(S)); }
function ymd(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function today(){ return ymd(new Date()); }
function yesterday(){ return ymd(new Date(Date.now()-864e5)); }

const app = document.getElementById('app');
function render(){
  if(!S){ renderOnboarding(); return; }
  if(!S.startDate) S.startDate = S.day || today();
  if(!S.history) S.history = {};
  if(!S.weightLog) S.weightLog = {};
  if(!S.exSets) S.exSets = {};
  if(!S.dailyDone) S.dailyDone = {grip:false,mystery:false};
  if(S.dailyDone.mystery===undefined) S.dailyDone.mystery = false;
  if(S.dailyDone.grip===undefined) S.dailyDone.grip = false;
  if(S.penaltyToday===undefined) S.penaltyToday = false;
  if(!S.tzMigrated){ S.tzMigrated = true; S.day = today(); save(); }
  if(S.day !== today()){
    S.day = today();
    S.exSets = {};
    S.dailyDone = {grip:false,mystery:false};
    S.dailyClaimed = false;
    S.gateDoneToday = false;
    S.penaltyToday = false;
    const sched = scheduleFor(S.day);
    if(sched==='rest'){
      if(S.lastActive===yesterday() || S.streak===0) S.lastActive=S.day;
    }
    save();
  }
  const info = levelFromXp(S.xp);
  const pct = info.maxed ? 100 : Math.round(info.into/info.need*100);
  const rk = rankFor(info.lvl);
  const title = titleFor(info.lvl);
  const gateId = scheduleFor(S.day);
  const gate = GATES[gateId];
  const goalPct = Math.max(0, Math.min(100, Math.round((S.weight - S.startW)/(S.goalW - S.startW)*100)));
  const proteinLo = Math.round(S.weight*1.6), proteinHi = Math.round(S.weight*2.2);
  const loggedToday = S.weightLog[S.day]!=null;
  const trainedDays = Object.keys(S.history).length;
  const tier = overloadTierFor(S.stats.str);
  const mysteryTask = mysteryQuestFor(S.day);

  app.innerHTML = `
    <div style="text-align:center;margin:4px 0 16px">
      <div class="eyebrow" style="justify-content:center">Ascension System</div>
    </div>

    <section class="win">
      <div class="hunter-top">
        <div>
          <div class="hname">${esc(S.name)}</div>
          <div class="lvl">LEVEL <b>${info.lvl}</b></div>
          <div class="title-line">"${title.t}"</div>
        </div>
        <div class="rank">${rk.r}<small>${rk.lbl.toUpperCase()}</small></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="bar-meta"><span>${info.maxed?'MAX LEVEL - ASCENSION COMPLETE':'XP '+info.into+' / '+info.need}</span><span>${pct}%</span></div>

      <div class="stats">
        ${statBox('Strength',S.stats.str,'str')}
        ${statBox('Vitality',S.stats.vit,'vit')}
        ${statBox('Endurance',S.stats.end,'end')}
        ${statBox('Agility',S.stats.agi,'agi')}
      </div>
      ${S.penaltyToday?`<div class="penalty" style="margin-top:10px">⚠ PENALTY ZONE ACTIVE - stats suppressed until tomorrow (streak broken)</div>`:''}
    </section>

    <section class="win">
      <div class="eyebrow">Weight Progress</div>
      <div class="weight-row">
        <div class="weight-now">${fmt(S.weight)}<span> kg</span></div>
        <div class="weight-goal">GOAL ${fmt(S.goalW)} kg</div>
      </div>
      <div class="bar"><i style="width:${goalPct}%;background:linear-gradient(90deg,var(--green),var(--cyan))"></i></div>
      <div class="bar-meta"><span>Start ${fmt(S.startW)} kg</span><span>${goalPct}% to goal</span></div>
      <div class="inline-w" style="margin-top:12px">
        <input id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="Log today's weight" ${loggedToday?'disabled':''}>
        <button class="btn sm" onclick="logWeight()" ${loggedToday?'disabled':''}>${loggedToday?'Logged ✓':'Log'}</button>
      </div>
      ${loggedToday?`<div style="font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:8px;text-transform:uppercase">Weight already logged today - come back tomorrow</div>`:''}
    </section>

    <section class="win">
      <div class="eyebrow">Quest - Today's Gate</div>
      <div class="gates">
        ${gateBtn('push',gateId)}${gateBtn('pull',gateId)}${gateBtn('legs',gateId)}
      </div>
      ${gateId==='rest' ? `
        <div style="text-align:center;padding:22px 10px 10px">
          <div style="font-family:'Orbitron';font-size:15px;letter-spacing:.14em;color:var(--cyan-soft);margin-bottom:8px">RECOVERY PROTOCOL</div>
          <div style="color:var(--muted);font-size:14px">This is a rest day. Enjoy your temporary freedom, Hunter.</div>
        </div>
      ` : `
        <div style="font-family:'Orbitron';font-size:12px;letter-spacing:.1em;color:${gate.color==='red'?'#ff8080':gate.color==='violet'?'#b79cff':'var(--cyan-soft)'};margin-bottom:10px">
          ${gate.icon} GATE - ${gate.name} <span style="color:var(--muted);font-size:10px">- ${gate.sub}</span>
        </div>
        <div class="tier-banner">⚡ Strength ${tier.label} - ${tier.tip}</div>
        <ul class="ex">
          ${gate.ex.map((e,i)=>{
            const max=parseSets(e.t);
            const cnt=S.exSets[i]||0;
            const done=cnt>=max;
            return `
          <li class="${done?'done':''}" onclick="toggleEx(${i})">
            <span class="chk">${done?'\u2713':(cnt>0?cnt:'')}</span>
            <span class="ex-nm">${e.n}<small>${e.d}</small></span>
            <span class="ex-tg">${cnt}/${max} sets - ${e.t}</span>
          </li>`;}).join('')}
        </ul>
        <button class="btn" id="completeBtn" ${S.gateDoneToday?'disabled':''} onclick="completeGate()">
          ${S.gateDoneToday?'Gate cleared today \u2713':'Clear the Gate'}
        </button>
      `}
    </section>

    <section class="win">
      <div class="eyebrow">Hunter's Daily Quest</div>
      <div class="daily">
        <div class="dq" onclick="toggleDaily('grip')">
          <span class="chk" style="${S.dailyDone.grip?'background:rgba(77,163,255,.18);color:var(--cyan);box-shadow:0 0 12px rgba(77,163,255,.5)':''}">\u2713</span>
          <span class="t">40 reps of grip strengthener<small>Forearm and grip work - every day</small></span>
        </div>
        <div class="dq" onclick="toggleDaily('mystery')">
          <span class="chk" style="${S.dailyDone.mystery?'background:rgba(77,163,255,.18);color:var(--cyan);box-shadow:0 0 12px rgba(77,163,255,.5)':''}">\u2713</span>
          <span class="t">${mysteryTask}<small>Hunter's mystery task - changes daily</small></span>
        </div>
      </div>
      ${!(S.dailyDone.grip&&S.dailyDone.mystery)
        ? `<div class="penalty">\u26a0 Penalty zone active - complete the daily quest</div>`
        : `<div style="font-size:12px;color:var(--green);letter-spacing:.08em;margin-top:10px;text-transform:uppercase">\u2713 Daily quest cleared - +30 XP available</div>`}
      <button class="btn ghost" style="margin-top:12px" onclick="claimDaily()"
        ${(S.dailyDone.grip&&S.dailyDone.mystery&&!S.dailyClaimed)?'':'disabled'}>
        ${S.dailyClaimed?'Reward claimed \u2713':'Claim +30 XP'}
      </button>
      <div class="streak">\ud83d\udd25 Streak: ${S.streak} day${S.streak===1?'':'s'}</div>
    </section>

    <section class="win">
      <div class="eyebrow">Ascension Log</div>
      <div class="stats">
        <div class="stat"><span class="k">Days Trained</span><span class="stat-val">${trainedDays}</span></div>
        <div class="stat"><span class="k">Current Streak</span><span class="stat-val">${S.streak}</span></div>
      </div>
      <details class="guide" style="margin-top:14px">
        <summary>View full history</summary>
        <div class="guide-body">${buildHistory()}</div>
      </details>
    </section>

    <section class="win">
      <details class="guide">
        <summary>System Guide - How to gain mass the healthy way</summary>
        <div class="guide-body">
          <p><b>The goal:</b> go from ${fmt(S.startW)} to ${fmt(S.goalW)} kg cleanly. Gain <b>~0.25-0.4 kg per week</b>. If you gain faster than that consistently, most of it is fat - dial the food back a bit.</p>
          <p><b>Food:</b> eat in a <b>slight surplus</b> (a bit more than you burn). No need to count every calorie: eat a little more each meal and keep an easy extra on hand (fruit, nuts, a shake).</p>
          <p><b>Protein:</b> aim for <b>${proteinLo}-${proteinHi} g/day</b> (~1.6-2.2 g per kg). Your protein powder covers whatever you miss.</p>
          <p><b>Overloading with 20 kg dumbbells:</b> when a lift feels too easy, progress like this -> more reps -> slow negatives (3-4 s) -> single-limb versions (Bulgarian split squats, one-arm rows) -> less rest. For push-ups and pull-ups: add weight in the backpack.</p>
          <p><b>Weigh in</b> once a week, fasted and under the same conditions, to read the real trend.</p>
          <p class="note">This is general training guidance, not medical or personalized nutrition advice. If you have health concerns, check with a professional.</p>
        </div>
      </details>
    </section>

    <div class="foot">Arise.</div>
    <button class="reset" onclick="hardReset()">Reset on awakening (erase data)</button>
  `;

  const wIn=document.getElementById('wIn'); if(wIn) wIn.value='';
}

function statBox(label,val,key){
  const up = S._upStats && S._upStats[key];
  const displayVal = (S.penaltyToday && !up) ? Math.max(1, val-2) : val;
  const cls = up ? 'up' : (S.penaltyToday ? 'down' : '');
  return `<div class="stat ${cls}"><span class="k">${label}</span><span class="stat-val">${displayVal}</span></div>`;
}
function gateBtn(id,activeId){
  const g=GATES[id];
  return `<div class="gate" data-color="${g.color}" data-active="${activeId===id?1:0}">
    <div class="g-ic">${g.icon}</div><div class="g-nm">${g.name}</div><div class="g-sub">${g.sub.split(' - ')[0]}</div></div>`;
}

function toggleEx(i){
  const gateId=scheduleFor(S.day);
  const g=GATES[gateId];
  if(!g) return;
  const max=parseSets(g.ex[i].t);
  const cur=S.exSets[i]||0;
  S.exSets[i] = (cur+1)>max ? 0 : cur+1;
  save(); render();
}
function toggleDaily(k){ S.dailyDone[k]=!S.dailyDone[k]; save(); render(); }

function allChecked(){
  const gateId=scheduleFor(S.day);
  const g=GATES[gateId];
  if(!g) return false;
  return g.ex.every((e,i)=>(S.exSets[i]||0)>=parseSets(e.t));
}
function completeGate(){
  const gateId=scheduleFor(S.day);
  const g=GATES[gateId];
  if(!g || S.gateDoneToday) return;
  if(!allChecked()){
    toast('Quest incomplete','Complete every set to clear the Gate.');
    return;
  }
  const before=levelFromXp(S.xp).lvl;
  const gained={};
  for(const k in g.gains){ S.stats[k]+=g.gains[k]; gained[k]=g.gains[k]; }
  S._upStats=gained;
  S.xp += 100;
  bumpStreak();
  S.gateDoneToday=true;
  S.history[S.day] = {gate:gateId, xp:100};
  save();
  const after=levelFromXp(S.xp).lvl;
  render();
  const penaltyXp=S._lastPenaltyXp; S._lastPenaltyXp=null;
  if(after>before){ showLevelUp(after,g.gains); }
  else { toast('Gate cleared','+100 XP - '+g.name+' complete.'); }
  if(penaltyXp){
    setTimeout(()=>{ toast('Streak broken','-'+penaltyXp+' XP penalty. Stats suppressed today.'); }, after>before?400:3000);
  }
  setTimeout(()=>{ S._upStats=null; },1800);
}
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
function historyDrill(level,year,month){
  historyNav = {level, year:year||null, month:month||null};
  render();
}
function buildHistory(){
  const dates = Object.keys(S.history||{}).sort().reverse();
  if(!dates.length) return '<p class="note">No entries yet - clear a Gate to begin your Ascension Log.</p>';

  if(historyNav.level==='years'){
    const years={};
    dates.forEach(d=>{ const y=d.slice(0,4); years[y]=(years[y]||0)+1; });
    return Object.keys(years).sort().reverse().map(y=>`
      <div class="hist-row" onclick="historyDrill('months','${y}')">
        <span class="hr-n">${y}</span><span class="hr-c">${years[y]} day${years[y]===1?'':'s'} trained</span>
      </div>`).join('');
  }

  if(historyNav.level==='months'){
    const y=historyNav.year;
    const months={};
    dates.filter(d=>d.slice(0,4)===y).forEach(d=>{ const m=d.slice(0,7); months[m]=(months[m]||0)+1; });
    return `<div class="hist-back" onclick="historyDrill('years')">&larr; All years</div>` +
      Object.keys(months).sort().reverse().map(m=>{
        const mi=parseInt(m.slice(5,7),10)-1;
        return `<div class="hist-row" onclick="historyDrill('days','${y}','${m}')">
          <span class="hr-n">${MONTH_NAMES[mi]}</span><span class="hr-c">${months[m]} day${months[m]===1?'':'s'} trained</span>
        </div>`;
      }).join('');
  }

  if(historyNav.level==='days'){
    const m=historyNav.month;
    const mi=parseInt(m.slice(5,7),10)-1;
    const dayList=dates.filter(d=>d.slice(0,7)===m);
    return `<div class="hist-back" onclick="historyDrill('months','${historyNav.year}')">&larr; ${MONTH_NAMES[mi]} ${historyNav.year}</div>` +
      dayList.map(d=>{
        const h=S.history[d];
        const w=S.weightLog?S.weightLog[d]:null;
        let line=`${GATES[h.gate].name} cleared (+${h.xp} XP)`;
        if(w!=null) line+=` &middot; Weight ${fmt(w)} kg`;
        return `<p style="margin:0 0 8px;font-size:13px"><b style="color:var(--cyan-soft)">${d}</b> - ${line}</p>`;
      }).join('');
  }
}
function claimDaily(){
  if(S.dailyClaimed) return;
  if(!(S.dailyDone.grip&&S.dailyDone.mystery)) return;
  const before=levelFromXp(S.xp).lvl;
  S.xp+=30; S.dailyClaimed=true;
  S.stats.vit+=1; S._upStats={vit:1};
  bumpStreak();
  save();
  const after=levelFromXp(S.xp).lvl;
  render();
  const penaltyXp=S._lastPenaltyXp; S._lastPenaltyXp=null;
  if(after>before) showLevelUp(after,{vit:1});
  else toast('Discipline','+30 XP - hunter daily quest.');
  if(penaltyXp){
    setTimeout(()=>{ toast('Streak broken','-'+penaltyXp+' XP penalty. Stats suppressed today.'); }, after>before?400:3000);
  }
  setTimeout(()=>{ S._upStats=null; },1800);
}
function logWeight(){
  if(S.weightLog[S.day]!=null){ toast('Already logged','You already logged your weight today.'); return; }
  const v=parseFloat(document.getElementById('wIn').value);
  if(isNaN(v)||v<30||v>250){ toast('Invalid entry','Enter a valid weight in kg.'); return; }
  const prev=S.weight; S.weight=v;
  S.weightLog[S.day]=v;
  const goingUp = S.goalW>=S.startW;
  const progressed = goingUp ? v>prev : v<prev;
  save();
  if(progressed){
    S.stats.vit+=1; S._upStats={vit:1}; S.xp+=20;
    save(); render();
    toast('Ascension','Weight logged - +20 XP - Vitality +1');
    setTimeout(()=>{ S._upStats=null; },1800);
  } else { render(); toast('Logged','Weight updated.'); }
}
function bumpStreak(){
  if(S.lastActive===today()) return;
  const y=yesterday();
  const broke = S.lastActive!=null && S.lastActive!==y && S.streak>0;
  if(broke) applyStreakPenalty();
  S.streak = (S.lastActive===y) ? S.streak+1 : 1;
  S.lastActive=today();
}
function applyStreakPenalty(){
  const info = levelFromXp(S.xp);
  const xpLoss = Math.min(50, info.into);
  S.xp -= xpLoss;
  S.penaltyToday = true;
  S._lastPenaltyXp = xpLoss;
}

let toastT;
function toast(h,b){
  document.getElementById('toast-h').textContent=h;
  document.getElementById('toast-b').textContent=b;
  const t=document.getElementById('toast'); t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800);
}
function showLevelUp(lvl,gains){
  document.getElementById('lu-n').textContent=lvl;
  const map={str:'Strength',vit:'Vitality',end:'Endurance',agi:'Agility'};
  document.getElementById('lu-gains').innerHTML =
    Object.keys(gains).map(k=>`<div class="lu-gains">${map[k]} +${gains[k]}</div>`).join('');
  const rk=rankFor(lvl);
  document.getElementById('lu-rank').textContent='Current rank: '+rk.lbl.toUpperCase();
  document.getElementById('overlay').classList.add('show');
}
function closeLevelUp(){ document.getElementById('overlay').classList.remove('show'); }

function renderOnboarding(){
  app.innerHTML = `
    <div style="text-align:center;margin:24px 0 10px">
      <div class="eyebrow" style="justify-content:center">System Notification</div>
    </div>
    <section class="win">
      <div style="text-align:center;margin-bottom:6px">
        <div style="font-family:'Orbitron';font-size:13px;letter-spacing:.1em;color:var(--cyan-soft)">You have been selected</div>
        <h1 class="title-xl" style="margin:8px 0">as a Player</h1>
        <p style="color:var(--muted);font-size:14px;letter-spacing:.03em;margin:8px 0 4px">
          Only you can see the System. Log your starting point and begin to ascend.</p>
      </div>
      <label>Hunter name</label>
      <input id="o-name" placeholder="Your name" value="Txetxe">
      <div style="display:flex;gap:10px">
        <div style="flex:1"><label>Current weight (kg)</label><input id="o-w" type="number" inputmode="decimal" step="0.1" value="75"></div>
        <div style="flex:1"><label>Goal (kg)</label><input id="o-g" type="number" inputmode="decimal" step="0.1" value="82"></div>
      </div>
      <button class="btn" onclick="startGame()">Accept the quest</button>
    </section>
    <div class="foot">The system is watching.</div>
  `;
}
function startGame(){
  const name=(document.getElementById('o-name').value||'Hunter').trim();
  const w=parseFloat(document.getElementById('o-w').value);
  const g=parseFloat(document.getElementById('o-g').value);
  if(isNaN(w)||isNaN(g)){ toast('Missing data','Enter current weight and goal.'); return; }
  S={
    name, startW:w, weight:w, goalW:g,
    xp:0, stats:{str:10,vit:10,end:10,agi:10},
    startDate:today(), exSets:{}, gateDoneToday:false, tzMigrated:true,
    dailyDone:{grip:false,mystery:false}, dailyClaimed:false,
    streak:0, lastActive:null, day:today(),
    history:{}, weightLog:{}
  };
  save(); render();
  toast('System online','Welcome, '+name+'. Let the ascension begin.');
}
function hardReset(){
  if(confirm('Erase all progress and awaken again?')){ store.del(KEY); S=null; render(); }
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return (Math.round(n*10)/10).toString(); }

render();
</script>
</body>
</html>
